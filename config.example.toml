# Example configuration file for data export tool

[database]
# Supported values: oracle, mysql, postgresql
db_type = "oracle"

# Oracle: host:port/service_name
# MySQL: host:port/database or mysql://host:port/database
connection_string = "localhost:1521/ORCL"

username = "your_username"
password = "your_password"

# Fetch size for batch processing
fetch_size = 1000

[export]
# Query SQL statement or SQL file path
# Examples:
#   query = "SELECT * FROM your_table"
#   query = "query.sql"
query = "SELECT * FROM your_table"

output_file = "output.csv"

# Supported values: csv, tsv, custom
format = "csv"

# Default delimiter is ASCII 3 (\u0003)
delimiter = "\u0003"

show_progress = true
progress_interval = 1000000
include_header = false
buffer_size = 1048576

# Supported values: none, gzip
compression = "none"

# Skip rows with errors instead of aborting export
skip_errors = false

[logging]
# log_file = "export.log"
verbose = false
