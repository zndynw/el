# PostgreSQL 导出配置示例

[database]
db_type = "postgresql"
connection_string = "localhost:5432/mydb"
# 或使用完整 URL: connection_string = "postgresql://localhost:5432/mydb"
username = "postgres"
password = "password"
fetch_size = 10000

[export]
query = "SELECT * FROM users WHERE created_at >= '2024-01-01'"
# 或从文件读取: query = "@query.sql"
output_file = "users.csv"
format = "csv"  # csv, tsv, custom
delimiter = ","
include_header = true
show_progress = true
progress_interval = 100000
count_rows = false
compression = "none"  # none, gzip

[logging]
log_file = "export.log"
verbose = false
